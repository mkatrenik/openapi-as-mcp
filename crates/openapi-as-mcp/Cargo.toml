[package]
name = "openapi-as-mcp"
version.workspace = true
edition.workspace = true
description = "Serve any OpenAPI 3.x document as an MCP tool set"

[dependencies]
openapi-core = { path = "../openapi-core" }
rmcp = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
# The protocol test drives the built binary as a child process over stdio.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
