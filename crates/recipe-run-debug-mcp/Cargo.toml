[package]
name = "recipe-run-debug-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server for debugging ingestion-platform recipe runs"

[dependencies]
rmcp = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
schemars = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }
# Model codegen, run on demand via `cargo run --example generate_models`. Dev-only: the generated
# file is committed, so a normal build never needs these.
typify = { workspace = true }
schemars_0_8 = { workspace = true }
syn = { workspace = true }
prettyplease = { workspace = true }
# The protocol test drives the built binary as a child process over stdio.
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
