[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Shared versions for every tool in the workspace: a member picks a dependency up with
# `foo = { workspace = true }` and may add features on top of what is declared here.
[workspace.dependencies]
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
uuid = { version = "1.24.0", features = ["serde", "v4"] }

wiremock = "0.6"
typify = "0.7"
schemars_0_8 = { package = "schemars", version = "0.8" }
syn = "2"
prettyplease = "0.2"
